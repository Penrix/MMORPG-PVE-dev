name: Naruto Third War Verify Temporary
# Final rerun after seed-script typecheck fix.

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - .github/workflows/naruto-third-war-verify-temporary.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- naruto-source-import naruto-third-war-konoha source-world-production
      - run: npm run build
