name: Temporary Atlas framework formatter

on:
  push:
    branches:
      - feat/module2-world-atlas-lite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-framework-format-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module2-world-atlas-lite
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          AGENTS.md
          docs/mmorpg/08-world-database-v01-v07-crosswalk.md
          docs/mmorpg/13-world-atlas-lightweight-core.md
          docs/mmorpg/14-world-atlas-content-framework-v01.md
          packages/contracts/src/index.ts
          packages/contracts/src/world-atlas.ts
          packages/contracts/test/world-atlas.test.ts
          packages/persistence/src/source-card-links.ts
          packages/persistence/src/source-corpus-repository.ts
          packages/services/src/unified-source-world-routes.ts
          apps/web/src/lib/api.ts
          apps/web/src/workspaces/world-atlas.tsx
          apps/web/src/styles/world-atlas.css
          apps/server/test/world-atlas-framework-api.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/mmorpg/08-world-database-v01-v07-crosswalk.md docs/mmorpg/13-world-atlas-lightweight-core.md docs/mmorpg/14-world-atlas-content-framework-v01.md packages/contracts/src/index.ts packages/contracts/src/world-atlas.ts packages/contracts/test/world-atlas.test.ts packages/persistence/src/source-card-links.ts packages/persistence/src/source-corpus-repository.ts packages/services/src/unified-source-world-routes.ts apps/web/src/lib/api.ts apps/web/src/workspaces/world-atlas.tsx apps/web/src/styles/world-atlas.css apps/server/test/world-atlas-framework-api.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(atlas): format World Content Framework implementation"
          git push origin HEAD:refs/heads/feat/module2-world-atlas-lite
