name: Temporary Atlas formatter

on:
  push:
    branches:
      - feat/module2-world-atlas-lite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-format-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module2-world-atlas-lite
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          packages/persistence/src/source-card-links.ts
          packages/persistence/src/source-corpus-repository.ts
          packages/persistence/src/unified-source-world-repository.ts
          packages/persistence/test/source-world-card-index.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/source-card-links.ts packages/persistence/src/source-corpus-repository.ts packages/persistence/src/unified-source-world-repository.ts packages/persistence/test/source-world-card-index.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(atlas): format typed-link implementation"
          git push origin HEAD:refs/heads/feat/module2-world-atlas-lite
