name: Module2 Power Projection Verify Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - ".github/workflows/module2-power-projection-verify-temporary.yml"
      - "packages/persistence/src/source-world-rich-normalizers.ts"
      - "packages/persistence/src/source-world-catalog.ts"
      - "packages/persistence/test/source-world-multiworld.test.ts"
      - "scripts/import-source-world.ts"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- source-world-multiworld
