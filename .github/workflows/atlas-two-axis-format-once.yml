name: Temporary Atlas two-axis formatter

on:
  push:
    branches:
      - feat/module2-world-atlas-lite

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module2-world-atlas-lite
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          AGENTS.md
          docs/mmorpg/README.md
          docs/mmorpg/14-world-atlas-content-framework-v01.md
          docs/mmorpg/15-people-centered-narrative-axis.md
          packages/contracts/src/world-atlas.ts
          packages/contracts/test/world-atlas.test.ts
          packages/services/src/unified-source-world-routes.ts
          apps/server/test/world-atlas-framework-api.test.ts
          apps/web/src/workspaces/world-atlas.tsx
          apps/web/src/styles/world-atlas.css
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/mmorpg/README.md docs/mmorpg/14-world-atlas-content-framework-v01.md docs/mmorpg/15-people-centered-narrative-axis.md packages/contracts/src/world-atlas.ts packages/contracts/test/world-atlas.test.ts packages/services/src/unified-source-world-routes.ts apps/server/test/world-atlas-framework-api.test.ts apps/web/src/workspaces/world-atlas.tsx apps/web/src/styles/world-atlas.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(atlas): format two-axis World Atlas changes"
          git push origin HEAD:refs/heads/feat/module2-world-atlas-lite
