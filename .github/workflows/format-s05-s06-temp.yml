name: TEMP format S05 S06 correction

on:
  push:
    branches:
      - feat/module3-world-atlas-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module3-world-atlas-integration
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format S05/S06 change set
        run: |
          npx prettier --write \
            packages/narrative/src/story-authoring-runtime-workers.ts \
            packages/narrative/src/story-authoring-runtime.ts \
            packages/narrative/src/story-scene-runtime-workers.ts \
            packages/narrative/test/story-authoring-runtime-workers.test.ts \
            packages/narrative/test/story-authoring-runtime.test.ts \
            packages/narrative/test/story-runtime.test.ts \
            packages/narrative/test/story-scene-runtime.test.ts
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/narrative/src/story-authoring-runtime-workers.ts \
            packages/narrative/src/story-authoring-runtime.ts \
            packages/narrative/src/story-scene-runtime-workers.ts \
            packages/narrative/test/story-authoring-runtime-workers.test.ts \
            packages/narrative/test/story-authoring-runtime.test.ts \
            packages/narrative/test/story-runtime.test.ts \
            packages/narrative/test/story-scene-runtime.test.ts
          git commit -m "style: format S05 node and S06 scene expansion"
          git push origin HEAD:feat/module3-world-atlas-integration
