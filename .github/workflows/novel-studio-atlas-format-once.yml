name: Temporary Novel Studio Atlas formatter

on:
  push:
    branches:
      - feat/novel-studio-world-atlas

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/novel-studio-world-atlas
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          AGENTS.md
          docs/mmorpg/README.md
          docs/mmorpg/17-novel-studio-world-atlas-integration.md
          packages/persistence/src/unified-source-world-repository.ts
          packages/persistence/src/project-reality-repository.ts
          packages/persistence/test/project-reality-atlas.test.ts
          packages/narrative/src/world-atlas-context.ts
          packages/narrative/src/index.ts
          packages/narrative/src/workers.ts
          packages/narrative/test/world-atlas-context.test.ts
          packages/narrative/test/settlement-application-service.test.ts
          packages/services/src/story-context.ts
          packages/services/test/story-context-atlas.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/mmorpg/README.md docs/mmorpg/17-novel-studio-world-atlas-integration.md packages/persistence/src/unified-source-world-repository.ts packages/persistence/src/project-reality-repository.ts packages/persistence/test/project-reality-atlas.test.ts packages/narrative/src/world-atlas-context.ts packages/narrative/src/index.ts packages/narrative/src/workers.ts packages/narrative/test/world-atlas-context.test.ts packages/narrative/test/settlement-application-service.test.ts packages/services/src/story-context.ts packages/services/test/story-context-atlas.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(novel-studio): format World Atlas integration"
          git push origin HEAD:refs/heads/feat/novel-studio-world-atlas
