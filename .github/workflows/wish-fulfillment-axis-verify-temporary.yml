name: Wish Fulfillment Axis Verify Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - .github/workflows/wish-fulfillment-axis-verify-temporary.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format this batch only
        run: |
          npx prettier --write             packages/contracts/src/world-pack.ts             packages/narrative/src/world-production-engine.ts             packages/narrative/src/world-production-runner.ts             packages/narrative/test/world-production-engine.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- world-production-engine
      - run: npm run build
      - name: Commit batch formatting
        run: |
          if git diff --quiet --             packages/contracts/src/world-pack.ts             packages/narrative/src/world-production-engine.ts             packages/narrative/src/world-production-runner.ts             packages/narrative/test/world-production-engine.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             packages/contracts/src/world-pack.ts             packages/narrative/src/world-production-engine.ts             packages/narrative/src/world-production-runner.ts             packages/narrative/test/world-production-engine.test.ts
          git commit -m "chore(module1): format wish-fulfillment axis batch"
          git push
