name: Temporary Atlas kind compatibility formatter

on:
  push:
    branches:
      - feat/module2-world-atlas-lite

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module2-world-atlas-lite
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write packages/persistence/src/source-corpus-repository.ts
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/source-corpus-repository.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(atlas): format card kind compatibility layer"
          git push origin HEAD:refs/heads/feat/module2-world-atlas-lite
