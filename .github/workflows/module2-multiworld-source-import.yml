name: Module 2 multi-world source import smoke

on:
  pull_request:
    paths:
      - ".github/workflows/module2-multiworld-source-import.yml"
      - "scripts/import-source-world.ts"
      - "packages/persistence/src/source-world-catalog.ts"
      - "packages/persistence/src/source-world-seed.ts"
      - "packages/persistence/src/source-world-normalizers.ts"
      - "packages/persistence/src/source-world-rich-normalizers.ts"
      - "packages/persistence/src/source-corpus-repository.ts"
      - "packages/persistence/src/unified-source-world-repository.ts"
      - "packages/persistence/test/source-world-multiworld.test.ts"
      - "packages/services/src/unified-source-world-routes.ts"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiworld-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify generic multi-world contracts
        run: npm test -- source-world-multiworld source-world-production naruto-source-import
      - name: Import Naruto specialized mother world
        run: npm run import:naruto -- --db /tmp/narralume-multiworld.sqlite --skip-wiki
      - name: Import generic mother worlds
        run: npm run import:source-world -- --all --db /tmp/narralume-multiworld.sqlite
      - name: Audit four installed mother worlds
        run: |
          node --input-type=module <<'EOF'
          import { DatabaseSync } from "node:sqlite";
          import assert from "node:assert/strict";
          const db = new DatabaseSync("/tmp/narralume-multiworld.sqlite", {readOnly:true});
          const worlds = db.prepare("SELECT id,name,canonical_corpus_id AS corpus FROM source_worlds ORDER BY id").all();
          const canon = Object.fromEntries(worlds.map(w => [w.id, w.corpus]));
          const counts = Object.fromEntries(worlds.map(w => [
            w.id,
            db.prepare("SELECT COUNT(*) AS n FROM source_records WHERE corpus_id=?").get(w.corpus).n,
          ]));
          const relations = Object.fromEntries(worlds.map(w => [
            w.id,
            db.prepare("SELECT COUNT(*) AS n FROM source_relations WHERE corpus_id=?").get(w.corpus).n,
          ]));
          const cognitive = Object.fromEntries(worlds.map(w => [
            w.id,
            db.prepare("SELECT json_extract(metadata_json,'$.cognitiveMother.summary') AS summary FROM source_corpora WHERE id=?").get(w.corpus).summary,
          ]));
          const projectCanon = db.prepare("SELECT COUNT(*) AS n FROM canon_entities").get().n;
          console.log({worlds,counts,relations,cognitive,projectCanon});
          assert.deepEqual(Object.keys(canon).sort(), ["bleach","hunter-x-hunter","naruto","one-piece"]);
          assert(counts.naruto > 3000);
          assert(counts["one-piece"] > 20);
          assert(counts.bleach > 100);
          assert(counts["hunter-x-hunter"] > 50);
          assert(relations.naruto > 500);
          assert(relations["one-piece"] > 10);
          assert(relations.bleach > 50);
          assert(relations["hunter-x-hunter"] > 20);

          // Semantic POWER regression guard: a populated supernatural world
          // must retain system rules + character/ability links, not collapse
          // back into a flat list of ability labels.
          const powerCount = (corpus, prefix) =>
            db.prepare("SELECT COUNT(*) AS n FROM source_records WHERE corpus_id=? AND source_key LIKE ?")
              .get(corpus, prefix + "%").n;
          const relationCount = (corpus, relation) =>
            db.prepare("SELECT COUNT(*) AS n FROM source_relations WHERE corpus_id=? AND relation=?")
              .get(corpus, relation).n;

          assert(powerCount(canon["one-piece"], "rule:one-piece:haki:") >= 6);
          assert(powerCount(canon["one-piece"], "rule:one-piece:devil-fruit-class:") >= 3);
          assert(relationCount(canon["one-piece"], "devil_fruit_class_recorded") > 20);
          assert(relationCount(canon["one-piece"], "haki_type_recorded") >= 10);

          assert(powerCount(canon["hunter-x-hunter"], "rule:hxh:nen-category:") >= 6);
          assert(relationCount(canon["hunter-x-hunter"], "nen_category_recorded") > 20);
          assert(relationCount(canon["hunter-x-hunter"], "fundamental_of_recorded") >= 4);
          assert(relationCount(canon["hunter-x-hunter"], "advanced_application_of_recorded") >= 4);
          assert(relationCount(canon["hunter-x-hunter"], "part_of_power_system_recorded") > 50);

          for (const id of Object.keys(canon))
            assert(typeof cognitive[id] === "string" && cognitive[id].length > 10, id + " Cognitive Mother missing");
          assert.equal(projectCanon, 0, "Source imports must not fabricate Project Canon");
          db.close();
          EOF
      - name: Capture counts before re-import
        run: |
          node --input-type=module <<'EOF' > /tmp/multiworld-before.json
          import { DatabaseSync } from "node:sqlite";
          const db = new DatabaseSync("/tmp/narralume-multiworld.sqlite", {readOnly:true});
          const rows = db.prepare("SELECT corpus_id,COUNT(*) AS n FROM source_records GROUP BY corpus_id ORDER BY corpus_id").all();
          console.log(JSON.stringify(rows));
          db.close();
          EOF
      - name: Re-import generic worlds
        run: npm run import:source-world -- --all --db /tmp/narralume-multiworld.sqlite
      - name: Verify idempotence and Project isolation
        run: |
          node --input-type=module <<'EOF'
          import { DatabaseSync } from "node:sqlite";
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const before = JSON.parse(readFileSync("/tmp/multiworld-before.json","utf8"));
          const db = new DatabaseSync("/tmp/narralume-multiworld.sqlite", {readOnly:true});
          const after = db.prepare("SELECT corpus_id,COUNT(*) AS n FROM source_records GROUP BY corpus_id ORDER BY corpus_id").all();
          const normalized = after.map(row => ({corpus_id: row.corpus_id, n: row.n}));
          assert.deepEqual(normalized, before);
          assert.equal(db.prepare("SELECT COUNT(*) AS n FROM canon_entities").get().n, 0);
          db.close();
          EOF
