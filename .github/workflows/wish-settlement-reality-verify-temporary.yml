name: Wish Settlement Reality Verify Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - .github/workflows/wish-settlement-reality-verify-temporary.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format this batch only
        run: |
          npx prettier --write             packages/narrative/src/story-creative-context.ts             packages/narrative/src/settlement-application-service.ts             packages/narrative/test/settlement-application-service.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- settlement-application-service story-creative-frame-state
      - run: npm run build
      - name: Commit batch formatting
        run: |
          FILES="packages/narrative/src/story-creative-context.ts packages/narrative/src/settlement-application-service.ts packages/narrative/test/settlement-application-service.test.ts"
          if git diff --quiet -- $FILES; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(module3): format wish settlement Reality batch"
          git push
