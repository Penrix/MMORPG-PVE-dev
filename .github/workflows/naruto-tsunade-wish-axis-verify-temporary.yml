name: Naruto Tsunade Wish Axis Verify Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - .github/workflows/naruto-tsunade-wish-axis-verify-temporary.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check packages/narrative/test/naruto-tsunade-wish-axis.integration.test.ts
      - run: npm run typecheck
      - run: npm test -- naruto-tsunade-wish-axis.integration
      - run: npm run build
