name: Naruto Tsunade Wish Axis Verify Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - .github/workflows/naruto-tsunade-wish-axis-verify-temporary.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Tsunade exemplar
        run: npx prettier --write packages/narrative/test/naruto-tsunade-wish-axis.integration.test.ts
      - run: npm run typecheck
      - run: npm test -- naruto-tsunade-wish-axis.integration
      - run: npm run build
      - name: Commit exemplar formatting
        run: |
          if git diff --quiet -- packages/narrative/test/naruto-tsunade-wish-axis.integration.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/narrative/test/naruto-tsunade-wish-axis.integration.test.ts
          git commit -m "chore: format Naruto Tsunade wish-axis exemplar"
          git push
