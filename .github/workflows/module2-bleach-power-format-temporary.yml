name: Module2 Bleach Power Format Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - ".github/workflows/module2-bleach-power-format-temporary.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module3-world-atlas-integration
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/mmorpg/25-module2-dual-object-space.md packages/persistence/src/source-world-normalizers.ts packages/persistence/test/source-world-multiworld.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mmorpg/25-module2-dual-object-space.md packages/persistence/src/source-world-normalizers.ts packages/persistence/test/source-world-multiworld.test.ts
          git commit -m "style(module2): format power-family updates"
          git push origin HEAD:feat/module3-world-atlas-integration
