name: Source Wish Planner Verify Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - .github/workflows/source-wish-planner-verify-temporary.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format this batch only
        run: |
          npx prettier --write             packages/narrative/src/source-world-production.ts             packages/narrative/test/source-world-production.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- source-world-production
      - run: npm run build
      - name: Commit batch formatting
        run: |
          FILES="packages/narrative/src/source-world-production.ts packages/narrative/test/source-world-production.test.ts"
          if git diff --quiet -- $FILES; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(module1): format source wish planner batch"
          git push
