name: Temporary World Builder audit formatter

on:
  push:
    branches:
      - feat/world-builder-atlas-production

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/world-builder-atlas-production
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          packages/contracts/src/world-pack.ts
          packages/contracts/test/world-builder-atlas.test.ts
          packages/narrative/src/world-production-runner.ts
          apps/web/src/workspaces/world-builder.tsx
          apps/web/src/styles/world-builder.css
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/world-pack.ts packages/contracts/test/world-builder-atlas.test.ts packages/narrative/src/world-production-runner.ts apps/web/src/workspaces/world-builder.tsx apps/web/src/styles/world-builder.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(world-builder): format Atlas audit UI"
          git push origin HEAD:refs/heads/feat/world-builder-atlas-production
