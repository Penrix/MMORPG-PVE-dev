name: Temporary World Builder targeted formatter

on:
  push:
    branches:
      - feat/world-builder-atlas-production

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/world-builder-atlas-production
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          packages/narrative/src/world-production-engine.ts
          packages/narrative/test/world-production-engine.test.ts
          apps/server/test/world-pack-api.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/narrative/src/world-production-engine.ts packages/narrative/test/world-production-engine.test.ts apps/server/test/world-pack-api.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(world-builder): format playability audit changes"
          git push origin HEAD:refs/heads/feat/world-builder-atlas-production
