name: TEMP format Module3 upgrade stake refactor

on:
  push:
    branches:
      - feat/module3-world-atlas-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module3-world-atlas-integration
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Module-3 refactor files
        run: |
          npx prettier --write \
            packages/contracts/src/story-runtime.ts \
            packages/narrative/src/expectation-runtime-workers.ts \
            packages/narrative/src/story-authoring-runtime-workers.ts \
            packages/narrative/src/story-authoring-runtime.ts \
            packages/narrative/src/story-runtime-workers.ts \
            packages/narrative/src/story-runtime.ts \
            packages/narrative/test/expectation-runtime.test.ts \
            packages/narrative/test/expectation-runtime-workers.test.ts \
            packages/narrative/test/story-authoring-runtime.test.ts \
            packages/narrative/test/story-authoring-runtime-workers.test.ts \
            packages/narrative/test/story-runtime.test.ts \
            packages/narrative/test/story-runtime-workers.test.ts \
            packages/narrative/test/story-scene-runtime.test.ts \
            packages/narrative/test/story-scene-runtime-workers.test.ts
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/story-runtime.ts packages/narrative/src packages/narrative/test
          git commit -m "style: format Module 3 upgrade and stake refactor"
          git push origin HEAD:feat/module3-world-atlas-integration
