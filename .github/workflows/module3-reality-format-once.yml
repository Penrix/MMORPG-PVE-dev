name: Temporary Module3 Reality schema formatter

on:
  push:
    branches:
      - feat/module3-world-atlas-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module3-world-atlas-integration
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          docs/mmorpg/17-module3-world-atlas-integration.md
          packages/persistence/src/database.ts
          packages/persistence/src/migrations/056-project-reality-event-version-overlay.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mmorpg/17-module3-world-atlas-integration.md packages/persistence/src/database.ts packages/persistence/src/migrations/056-project-reality-event-version-overlay.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(module3): format Project Reality schema integration"
          git push origin HEAD:refs/heads/feat/module3-world-atlas-integration
