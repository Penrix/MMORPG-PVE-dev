name: Story Director API Gap Bridge Verify Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - .github/workflows/story-director-api-gap-bridge-verify-temporary.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format this API regression only
        run: npx prettier --write apps/server/test/story-director-api.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- story-director-api
      - run: npm run build
      - name: Commit API-test formatting
        run: |
          FILES="apps/server/test/story-director-api.test.ts"
          if git diff --quiet -- $FILES; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(api): format StoryGap bridge regression"
          git push
