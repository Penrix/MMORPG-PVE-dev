name: Module2 Rich Worlds Real Import Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - .github/workflows/module2-rich-worlds-real-temporary.yml

permissions:
  contents: read

jobs:
  real-rich-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Import rich One Piece
        run: npm run import:source-world -- --world one-piece --db /tmp/rich-worlds.sqlite
      - name: Import rich Hunter x Hunter
        run: npm run import:source-world -- --world hunter-x-hunter --db /tmp/rich-worlds.sqlite
      - name: Audit rich worlds
        run: |
          node --input-type=module <<'EOF'
          import { DatabaseSync } from "node:sqlite";
          import assert from "node:assert/strict";
          const db = new DatabaseSync("/tmp/rich-worlds.sqlite", {readOnly:true});
          const count = id => {
            const world = db.prepare("SELECT canonical_corpus_id AS corpus FROM source_worlds WHERE id=?").get(id);
            assert(world, "missing world " + id);
            return {
              cards: db.prepare("SELECT COUNT(*) AS n FROM source_records WHERE corpus_id=?").get(world.corpus).n,
              relations: db.prepare("SELECT COUNT(*) AS n FROM source_relations WHERE corpus_id=?").get(world.corpus).n,
              corpus: world.corpus,
            };
          };
          const onePiece = count("one-piece");
          const hxh = count("hunter-x-hunter");
          const find = (corpus, name) =>
            db.prepare("SELECT source_key AS sourceKey,name,kind FROM source_records WHERE corpus_id=? AND name=? LIMIT 1").get(corpus,name);
          const findKey = (corpus, sourceKey) =>
            db.prepare("SELECT source_key AS sourceKey,name,kind FROM source_records WHERE corpus_id=? AND source_key=? LIMIT 1").get(corpus,sourceKey);
          const checks = {
            luffy: find(onePiece.corpus, "Monkey D. Luffy"),
            gomu: find(onePiece.corpus, "Gomu Gomu no Mi"),
            egghead: find(onePiece.corpus, "Egghead"),
            enma: find(onePiece.corpus, "Enma"),
            chapter1044: findKey(onePiece.corpus, "manga-chapter:1044"),
            gon: find(hxh.corpus, "Gon Freecss"),
            hunterAssociation: find(hxh.corpus, "Hunter Association"),
            whaleIsland: find(hxh.corpus, "Whale Island"),
            jajanken: find(hxh.corpus, "Jajanken"),
            hunterExam: find(hxh.corpus, "Hunter Exam"),
          };
          const luffyEvidence = db.prepare("SELECT COUNT(*) AS n FROM source_world_evidence_links WHERE world_id='one-piece' AND canonical_key=?").get(checks.luffy.sourceKey).n;
          const luffyRelations = db.prepare("SELECT COUNT(*) AS n FROM source_relations WHERE corpus_id=? AND from_key=?").get(onePiece.corpus,checks.luffy.sourceKey).n;
          const gonEvidence = db.prepare("SELECT COUNT(*) AS n FROM source_world_evidence_links WHERE world_id='hunter-x-hunter' AND canonical_key=?").get(checks.gon.sourceKey).n;
          const gonRelations = db.prepare("SELECT COUNT(*) AS n FROM source_relations WHERE corpus_id=? AND from_key=?").get(hxh.corpus,checks.gon.sourceKey).n;
          const canon = db.prepare("SELECT COUNT(*) AS n FROM canon_entities").get().n;
          console.log({onePiece,hxh,checks,luffyEvidence,luffyRelations,gonEvidence,gonRelations,projectCanon:canon});
          assert(onePiece.cards > 3500, "One Piece rich graph unexpectedly thin");
          assert(onePiece.relations > 1000, "One Piece rich relations unexpectedly thin");
          assert(hxh.cards > 300, "HxH rich graph unexpectedly thin");
          assert(hxh.relations > 300, "HxH rich relations unexpectedly thin");
          for (const [key,value] of Object.entries(checks))
            assert(value, "missing representative object: " + key);
          assert(luffyEvidence >= 2, "Luffy rich + legacy evidence did not converge on one canonical identity");
          assert(luffyRelations >= 2, "Luffy rich relations did not thicken the bridged canonical card");
          assert(gonEvidence >= 3, "Gon rich + roster + static evidence did not converge on one canonical identity");
          assert(gonRelations >= 8, "Gon rich relations did not thicken the bridged canonical card");
          assert.equal(canon,0,"Source import must not write Project Canon");
          db.close();
          EOF
      - name: Audit power projections
        run: |
          node --input-type=module <<'EOF'
          import { DatabaseSync } from "node:sqlite";
          import assert from "node:assert/strict";
          const db = new DatabaseSync("/tmp/rich-worlds.sqlite", {readOnly:true});
          const corpus = id => db.prepare("SELECT canonical_corpus_id AS corpus FROM source_worlds WHERE id=?").get(id).corpus;
          const op = corpus("one-piece");
          const hxh = corpus("hunter-x-hunter");
          const record = (c,k) => db.prepare("SELECT source_key,name,kind,raw_json FROM source_records WHERE corpus_id=? AND source_key=?").get(c,k);
          const relCount = (c,relation) => db.prepare("SELECT COUNT(*) AS n FROM source_relations WHERE corpus_id=? AND relation=?").get(c,relation).n;
          const keyCount = (c,prefix) => db.prepare("SELECT COUNT(*) AS n FROM source_records WHERE corpus_id=? AND source_key LIKE ?").get(c,prefix+"%").n;

          const power = {
            onePiece: {
              rules: keyCount(op,"rule:one-piece:"),
              hakiRoot: record(op,"rule:one-piece:haki-system"),
              hakiBranches: keyCount(op,"rule:one-piece:haki:"),
              fruitRoot: record(op,"rule:one-piece:devil-fruit-system"),
              fruitClasses: keyCount(op,"rule:one-piece:devil-fruit-class:"),
              fruitClassRelations: relCount(op,"devil_fruit_class_recorded"),
              hakiUserRelations: relCount(op,"haki_type_recorded"),
              hakiAbilityLinks: relCount(op,"power_branch_reference_recorded"),
              awakeningRelations: relCount(op,"awakening_recorded"),
            },
            hxh: {
              rules: keyCount(hxh,"rule:hxh:"),
              nenRoot: record(hxh,"rule:hxh:nen-system"),
              nenCategories: keyCount(hxh,"rule:hxh:nen-category:"),
              categoryRelations: relCount(hxh,"nen_category_recorded"),
              fundamentals: relCount(hxh,"fundamental_of_recorded"),
              advanced: relCount(hxh,"advanced_application_of_recorded"),
              systemLinks: relCount(hxh,"part_of_power_system_recorded"),
            },
          };
          console.log(JSON.stringify(power,null,2));

          assert(power.onePiece.hakiRoot, "One Piece Haki root rule missing");
          assert(power.onePiece.hakiBranches >= 6, "One Piece Haki vocabulary projection too thin");
          assert(power.onePiece.fruitRoot, "One Piece Devil Fruit root rule missing");
          assert(power.onePiece.fruitClasses >= 3, "One Piece Devil Fruit classifications too thin");
          assert(power.onePiece.fruitClassRelations > 20, "Devil Fruit entities are not linked to classifications");
          assert(power.onePiece.hakiUserRelations >= 10, "One Piece characters are not linked to Haki branches");
          assert(power.onePiece.hakiAbilityLinks >= 10, "One Piece listed Haki abilities are not linked to Haki branches");

          assert(power.hxh.nenRoot, "HxH Nen root rule missing");
          assert(power.hxh.nenCategories >= 6, "HxH Nen categories too thin");
          assert(power.hxh.categoryRelations > 20, "HxH Hatsu are not linked to Nen categories");
          assert(power.hxh.fundamentals >= 4, "HxH fundamental Nen records not linked to system");
          assert(power.hxh.advanced >= 4, "HxH advanced Nen applications not linked to system");
          assert(power.hxh.systemLinks > 50, "HxH abilities are not linked to Nen system");
          assert.equal(db.prepare("SELECT COUNT(*) AS n FROM canon_entities").get().n,0);
          db.close();
          EOF
      - name: Capture counts before reimport
        run: |
          node --input-type=module <<'EOF' > /tmp/rich-before.json
          import { DatabaseSync } from "node:sqlite";
          const db = new DatabaseSync("/tmp/rich-worlds.sqlite",{readOnly:true});
          const rows=db.prepare("SELECT corpus_id,COUNT(*) AS n FROM source_records GROUP BY corpus_id ORDER BY corpus_id").all();
          console.log(JSON.stringify(rows.map(row=>({corpus_id:row.corpus_id,n:row.n}))));
          db.close();
          EOF
      - name: Reimport rich worlds
        run: |
          npm run import:source-world -- --world one-piece --db /tmp/rich-worlds.sqlite
          npm run import:source-world -- --world hunter-x-hunter --db /tmp/rich-worlds.sqlite
      - name: Verify rich reimport idempotence
        run: |
          node --input-type=module <<'EOF'
          import { DatabaseSync } from "node:sqlite";
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const before=JSON.parse(readFileSync("/tmp/rich-before.json","utf8"));
          const db=new DatabaseSync("/tmp/rich-worlds.sqlite",{readOnly:true});
          const after=db.prepare("SELECT corpus_id,COUNT(*) AS n FROM source_records GROUP BY corpus_id ORDER BY corpus_id").all().map(row=>({corpus_id:row.corpus_id,n:row.n}));
          assert.deepEqual(after,before);
          assert.equal(db.prepare("SELECT COUNT(*) AS n FROM canon_entities").get().n,0);
          db.close();
          EOF
