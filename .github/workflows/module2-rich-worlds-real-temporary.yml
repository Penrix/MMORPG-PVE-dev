name: Module2 Rich Worlds Real Import Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - .github/workflows/module2-rich-worlds-real-temporary.yml

permissions:
  contents: read

jobs:
  real-rich-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Import rich One Piece
        run: npm run import:source-world -- --world one-piece --db /tmp/rich-worlds.sqlite
      - name: Import rich Hunter x Hunter
        run: npm run import:source-world -- --world hunter-x-hunter --db /tmp/rich-worlds.sqlite
      - name: Audit rich worlds
        run: |
          node --input-type=module <<'EOF'
          import { DatabaseSync } from "node:sqlite";
          import assert from "node:assert/strict";
          const db = new DatabaseSync("/tmp/rich-worlds.sqlite", {readOnly:true});
          const count = id => {
            const world = db.prepare("SELECT canonical_corpus_id AS corpus FROM source_worlds WHERE id=?").get(id);
            assert(world, "missing world " + id);
            return {
              cards: db.prepare("SELECT COUNT(*) AS n FROM source_records WHERE corpus_id=?").get(world.corpus).n,
              relations: db.prepare("SELECT COUNT(*) AS n FROM source_relations WHERE corpus_id=?").get(world.corpus).n,
              corpus: world.corpus,
            };
          };
          const onePiece = count("one-piece");
          const hxh = count("hunter-x-hunter");
          const find = (corpus, name) =>
            db.prepare("SELECT source_key AS sourceKey,name,kind FROM source_records WHERE corpus_id=? AND name=? LIMIT 1").get(corpus,name);
          const checks = {
            luffy: find(onePiece.corpus, "Monkey D. Luffy"),
            gomu: find(onePiece.corpus, "Gomu Gomu no Mi"),
            egghead: find(onePiece.corpus, "Egghead"),
            enma: find(onePiece.corpus, "Enma"),
            chapter1044: find(onePiece.corpus, "Manga Chapter 1044"),
            gon: find(hxh.corpus, "Gon Freecss"),
            hunterAssociation: find(hxh.corpus, "Hunter Association"),
            whaleIsland: find(hxh.corpus, "Whale Island"),
            jajanken: find(hxh.corpus, "Jajanken"),
            hunterExam: find(hxh.corpus, "Hunter Exam"),
          };
          const canon = db.prepare("SELECT COUNT(*) AS n FROM canon_entities").get().n;
          console.log({onePiece,hxh,checks,projectCanon:canon});
          assert(onePiece.cards > 3500, "One Piece rich graph unexpectedly thin");
          assert(onePiece.relations > 1000, "One Piece rich relations unexpectedly thin");
          assert(hxh.cards > 300, "HxH rich graph unexpectedly thin");
          assert(hxh.relations > 300, "HxH rich relations unexpectedly thin");
          for (const [key,value] of Object.entries(checks))
            assert(value, "missing representative object: " + key);
          assert.equal(canon,0,"Source import must not write Project Canon");
          db.close();
          EOF
      - name: Capture counts before reimport
        run: |
          node --input-type=module <<'EOF' > /tmp/rich-before.json
          import { DatabaseSync } from "node:sqlite";
          const db = new DatabaseSync("/tmp/rich-worlds.sqlite",{readOnly:true});
          const rows=db.prepare("SELECT corpus_id,COUNT(*) AS n FROM source_records GROUP BY corpus_id ORDER BY corpus_id").all();
          console.log(JSON.stringify(rows.map(row=>({corpus_id:row.corpus_id,n:row.n}))));
          db.close();
          EOF
      - name: Reimport rich worlds
        run: |
          npm run import:source-world -- --world one-piece --db /tmp/rich-worlds.sqlite
          npm run import:source-world -- --world hunter-x-hunter --db /tmp/rich-worlds.sqlite
      - name: Verify rich reimport idempotence
        run: |
          node --input-type=module <<'EOF'
          import { DatabaseSync } from "node:sqlite";
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const before=JSON.parse(readFileSync("/tmp/rich-before.json","utf8"));
          const db=new DatabaseSync("/tmp/rich-worlds.sqlite",{readOnly:true});
          const after=db.prepare("SELECT corpus_id,COUNT(*) AS n FROM source_records GROUP BY corpus_id ORDER BY corpus_id").all().map(row=>({corpus_id:row.corpus_id,n:row.n}));
          assert.deepEqual(after,before);
          assert.equal(db.prepare("SELECT COUNT(*) AS n FROM canon_entities").get().n,0);
          db.close();
          EOF
