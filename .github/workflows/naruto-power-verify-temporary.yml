name: Naruto POWER Verify Temporary
# Rerun after lint cleanup.

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - ".github/workflows/naruto-power-verify-temporary.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- naruto-source-import
      - run: npm run build
      - name: Import real Naruto source
        run: npm run import:naruto -- --db /tmp/naruto-power.sqlite --skip-wiki
      - name: Audit Naruto POWER projection
        run: |
          node --input-type=module <<'EOF'
          import { DatabaseSync } from "node:sqlite";
          import assert from "node:assert/strict";
          const db = new DatabaseSync("/tmp/naruto-power.sqlite", {readOnly:true});
          const corpus = "naruto-dattebayo";
          const has = key => db.prepare("SELECT COUNT(*) AS n FROM source_records WHERE corpus_id=? AND source_key=?").get(corpus,key).n;
          const rel = name => db.prepare("SELECT COUNT(*) AS n FROM source_relations WHERE corpus_id=? AND relation=?").get(corpus,name).n;
          const rules = db.prepare("SELECT source_key,name FROM source_records WHERE corpus_id=? AND source_key LIKE 'rule:naruto:%' ORDER BY source_key").all(corpus);
          const natureObjects = db.prepare("SELECT COUNT(*) AS n FROM source_records WHERE corpus_id=? AND source_key LIKE 'nature:%'").get(corpus).n;
          const stats = {
            rules,
            natureObjects,
            jutsuSystemLinks: rel("part_of_power_system_recorded"),
            chakraNatureLinks: rel("chakra_nature_recorded"),
            projectCanon: db.prepare("SELECT COUNT(*) AS n FROM canon_entities").get().n,
          };
          console.log(JSON.stringify(stats,null,2));
          assert.equal(has("rule:naruto:jutsu-system"),1);
          assert.equal(has("rule:naruto:chakra-nature"),1);
          assert.equal(has("rule:naruto:kekkei-genkai"),1);
          assert(natureObjects > 5, "chakra nature objects unexpectedly thin");
          assert(stats.jutsuSystemLinks > 100, "POWER roots did not capture source-listed jutsu");
          assert(stats.chakraNatureLinks > 10, "character/beast chakra nature links unexpectedly thin");
          assert.equal(stats.projectCanon,0);
          db.close();
          EOF
