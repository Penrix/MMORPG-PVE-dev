name: Naruto formatter temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore(naruto): format vertical changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module3-world-atlas-integration
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Naruto vertical files
        run: |
          npx prettier --write             packages/narrative/src/source-world-production.ts             packages/narrative/test/source-world-production.test.ts             packages/persistence/src/naruto-source-world.ts             packages/persistence/src/source-card-links.ts             packages/persistence/test/naruto-source-import.test.ts             packages/persistence/test/source-world-card-index.test.ts             scripts/import-naruto.ts             scripts/audit-naruto-world.ts             .github/workflows/naruto-source-import.yml             .github/workflows/naruto-vertical-temporary.yml             package.json
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             packages/narrative/src/source-world-production.ts             packages/narrative/test/source-world-production.test.ts             packages/persistence/src/naruto-source-world.ts             packages/persistence/src/source-card-links.ts             packages/persistence/test/naruto-source-import.test.ts             packages/persistence/test/source-world-card-index.test.ts             scripts/import-naruto.ts             scripts/audit-naruto-world.ts             .github/workflows/naruto-source-import.yml             .github/workflows/naruto-vertical-temporary.yml             package.json
          git commit -m "chore(naruto): format vertical changes"
          git push origin HEAD:feat/module3-world-atlas-integration
