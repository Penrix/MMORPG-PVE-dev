name: Module2 Power Projection Format Temporary

on:
  push:
    branches:
      - feat/module3-world-atlas-integration
    paths:
      - ".github/workflows/module2-power-projection-format-temporary.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module3-world-atlas-integration
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write packages/persistence/src/source-world-rich-normalizers.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/source-world-rich-normalizers.ts
          git commit -m "style(module2): format power projection normalizer"
          git push origin HEAD:feat/module3-world-atlas-integration
