name: Branch Verify Temporary
# rerun after repository Prettier formatting

on:
  push:
    branches:
      - feat/module3-world-atlas-integration

permissions:
  contents: read

concurrency:
  group: branch-verify-temporary
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
