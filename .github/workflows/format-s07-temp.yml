name: TEMP format S07 Reader Time

on:
  push:
    branches:
      - feat/module3-world-atlas-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/module3-world-atlas-integration
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format S07 change set
        run: |
          npx prettier --write \
            packages/contracts/src/story-runtime.ts \
            packages/narrative/src/expectation-runtime-workers.ts \
            packages/narrative/src/expectation-runtime.ts \
            packages/narrative/test/expectation-runtime-workers.test.ts \
            packages/narrative/test/expectation-runtime.test.ts
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/story-runtime.ts \
            packages/narrative/src/expectation-runtime-workers.ts \
            packages/narrative/src/expectation-runtime.ts \
            packages/narrative/test/expectation-runtime-workers.test.ts \
            packages/narrative/test/expectation-runtime.test.ts
          git commit -m "style: format S07 scene-first Reader Time"
          git push origin HEAD:feat/module3-world-atlas-integration
